services:
  postgres:
    labels:
      io.idea-validation.environment: isolated-restore
      io.idea-validation.role: database
      io.idea-validation.attempt-id:
        ${IDEA_VALIDATION_ATTEMPT_ID:?IDEA_VALIDATION_ATTEMPT_ID is required}
      io.idea-validation.target-id:
        ${IDEA_VALIDATION_TARGET_ID:?IDEA_VALIDATION_TARGET_ID is required}
      io.idea-validation.candidate-manifest-sha256:
        ${IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256:?IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256
        is required}
  migrate:
    labels:
      io.idea-validation.environment: isolated-restore
      io.idea-validation.role: migration
      io.idea-validation.attempt-id:
        ${IDEA_VALIDATION_ATTEMPT_ID:?IDEA_VALIDATION_ATTEMPT_ID is required}
      io.idea-validation.target-id:
        ${IDEA_VALIDATION_TARGET_ID:?IDEA_VALIDATION_TARGET_ID is required}
      io.idea-validation.candidate-manifest-sha256:
        ${IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256:?IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256
        is required}
  app:
    ports:
      - target: 3000
        published: ${RESTORE_APP_PORT:?RESTORE_APP_PORT is required}
        host_ip: 127.0.0.1
        protocol: tcp
    labels:
      io.idea-validation.environment: isolated-restore
      io.idea-validation.role: application
      io.idea-validation.attempt-id:
        ${IDEA_VALIDATION_ATTEMPT_ID:?IDEA_VALIDATION_ATTEMPT_ID is required}
      io.idea-validation.target-id:
        ${IDEA_VALIDATION_TARGET_ID:?IDEA_VALIDATION_TARGET_ID is required}
      io.idea-validation.candidate-manifest-sha256:
        ${IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256:?IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256
        is required}
  caddy:
    profiles: [production-edge-only]
    labels:
      io.idea-validation.environment: isolated-restore
      io.idea-validation.role: edge
      io.idea-validation.attempt-id:
        ${IDEA_VALIDATION_ATTEMPT_ID:?IDEA_VALIDATION_ATTEMPT_ID is required}
      io.idea-validation.target-id:
        ${IDEA_VALIDATION_TARGET_ID:?IDEA_VALIDATION_TARGET_ID is required}
      io.idea-validation.candidate-manifest-sha256:
        ${IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256:?IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256
        is required}

networks:
  backend:
    labels:
      io.idea-validation.environment: isolated-restore
      io.idea-validation.role: network-backend
      io.idea-validation.attempt-id:
        ${IDEA_VALIDATION_ATTEMPT_ID:?IDEA_VALIDATION_ATTEMPT_ID is required}
      io.idea-validation.target-id:
        ${IDEA_VALIDATION_TARGET_ID:?IDEA_VALIDATION_TARGET_ID is required}
      io.idea-validation.candidate-manifest-sha256:
        ${IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256:?IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256
        is required}
  edge:
    labels:
      io.idea-validation.environment: isolated-restore
      io.idea-validation.role: network-edge
      io.idea-validation.attempt-id:
        ${IDEA_VALIDATION_ATTEMPT_ID:?IDEA_VALIDATION_ATTEMPT_ID is required}
      io.idea-validation.target-id:
        ${IDEA_VALIDATION_TARGET_ID:?IDEA_VALIDATION_TARGET_ID is required}
      io.idea-validation.candidate-manifest-sha256:
        ${IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256:?IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256
        is required}

volumes:
  postgres-data:
    labels: !override
      io.idea-validation.environment: isolated-restore
      io.idea-validation.role: database
      io.idea-validation.attempt-id:
        ${IDEA_VALIDATION_ATTEMPT_ID:?IDEA_VALIDATION_ATTEMPT_ID is required}
      io.idea-validation.target-id:
        ${IDEA_VALIDATION_TARGET_ID:?IDEA_VALIDATION_TARGET_ID is required}
      io.idea-validation.candidate-manifest-sha256:
        ${IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256:?IDEA_VALIDATION_CANDIDATE_MANIFEST_SHA256
        is required}
